[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd_hardware"
version = "0.1.0"
description = "Function-first hardware feature library for build123d — clearance holes, insert pockets, nut traps, bosses, snap fits, bearing pockets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Heartland Engineering" }]
keywords = ["build123d", "cad", "hardware", "bearings", "parametric", "3d-printing"]
dependencies = [
    "build123d>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "trimesh>=4",
    "numpy>=1.26",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
