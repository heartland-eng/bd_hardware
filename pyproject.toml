[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd_hardware"
version = "0.1.0"
description = "Function-first hardware feature library for build123d"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Heartland Engineering" }]
dependencies = ["build123d>=0.9"]

[project.optional-dependencies]
dev = ["pytest", "trimesh"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
